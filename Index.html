<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Premium Valentine Experience for Sadaf ji</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;400;500;700&display=swap');

        :root {
            --bg-light: #fdfcfb;
            --heart-pink: #ffb7c5; 
            --champagne: #e5c99e;
            --text-dark: #4a4a4a;
            --glass-white: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; outline: none; }

        body { 
            margin: 0; 
            font-family: 'Quicksand', sans-serif; 
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            height: 100vh; display: flex; justify-content: center; align-items: center; 
            overflow: hidden; transition: background 1.5s ease; color: var(--text-dark);
        }

        body.gold-theme { background: linear-gradient(135deg, #fff9f0 0%, #f7e8d0 100%); }

        .particles-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        .heart-particle { position: absolute; color: var(--heart-pink); opacity: 0; bottom: -20px; animation: floatAndSway linear infinite, pulse 2s ease-in-out infinite; user-select: none; filter: drop-shadow(0 0 2px rgba(255,183,197,0.4)); }

        @keyframes floatAndSway {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            100% { transform: translateY(-110vh) translateX(0) rotate(0deg); opacity: 0; }
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }

        .main-container { text-align: center; animation: fadeInScale 1.5s ease-out; z-index: 10; position: relative; width: 90%; }
        .name-header { font-size: 1.2rem; letter-spacing: 4px; text-transform: uppercase; color: #d4a373; margin-bottom: 0px; display: block; font-weight: 700; }
        h1 { font-family: 'Dancing Script', cursive; font-size: clamp(2.2rem, 8vw, 3.8rem); margin: 10px 0 40px; }

        .btn-group { display: flex; justify-content: center; gap: 15px; }
        .btn-premium { padding: 16px 40px; border-radius: 50px; border: 1px solid var(--champagne); background: white; color: var(--text-dark); text-transform: uppercase; letter-spacing: 2px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.4s; }
        .btn-yes { background: var(--champagne); color: white; border: none; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .glass-card { background: var(--glass-white); padding: 25px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; border: 1px solid white; box-shadow: 0 20px 50px rgba(0,0,0,0.08); position: relative; animation: slideUp 0.5s ease; }

        .comp-wrap { display: flex; gap: 15px; margin: 20px 0; justify-content: center; }
        .side-box { flex: 1; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; align-items: center; }
        .label-title { font-size: 0.7rem; font-weight: 800; margin-bottom: 12px; text-transform: uppercase; width: 100%; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; }
        
        .gif-frame { width: 80px; height: 80px; margin-bottom: 10px; overflow: hidden; border-radius: 12px; position: relative; background: #fffafb; }
        .pros-gifs img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; opacity: 0; animation: cycleSync 9s infinite; }
        
        .pros-cycle-text { position: relative; height: 20px; width: 100%; font-size: 0.65rem; font-weight: 700; color: #d4a373; overflow: hidden; }
        .pros-cycle-text span { position: absolute; width: 100%; left: 0; top: 0; opacity: 0; animation: cycleSync 9s infinite; }

        .pros-gifs img:nth-child(1), .pros-cycle-text span:nth-child(1) { animation-delay: 0s; }
        .pros-gifs img:nth-child(2), .pros-cycle-text span:nth-child(2) { animation-delay: 3s; }
        .pros-gifs img:nth-child(3), .pros-cycle-text span:nth-child(3) { animation-delay: 6s; }

        @keyframes cycleSync { 0%, 28% { opacity: 1; transform: translateY(0); } 33%, 100% { opacity: 0; transform: translateY(5px); } }

        .grid-row { display: flex; gap: 8px; margin-top: 20px; }
        .item-btn { flex: 1; padding: 15px 5px; background: white; border: 1px solid #eee; color: var(--text-dark); cursor: pointer; transition: 0.3s; font-size: 0.75rem; border-radius: 15px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 5px; }

        .env-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.1); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .envelope { position: relative; width: min(320px, 90vw); height: 180px; background: #f3bd6c; border-radius: 0 0 10px 10px; margin-top: 120px; }
        .envelope::before { content: ''; position: absolute; top: 0; border-top: 100px solid #e6ac53; border-left: min(160px, 45vw) solid transparent; border-right: min(160px, 45vw) solid transparent; transform-origin: top; transition: transform 1.2s ease; z-index: 2; }
        .envelope.open::before { transform: rotateX(180deg); z-index: 0; }
        
        .letter-paper { 
            position: absolute; bottom: 10px; left: 5%; width: 90%; 
            height: 160px; background: #fff; padding: 20px; transition: transform 1.2s ease, height 1.2s ease; 
            z-index: 1; border-radius: 5px; display: flex; flex-direction: column;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }
        .envelope.open .letter-paper { transform: translateY(-160px); height: 350px; z-index: 3; }
        .letter-scroll-area { overflow-y: auto; flex-grow: 1; padding-right: 5px; opacity: 0; transition: opacity 0.5s ease 1s; }
        .envelope.open .letter-scroll-area { opacity: 1; }

        .close-note-btn { background: #fff5f5; color: #ff8fa3; border: 1px solid #ffccd5; padding: 12px; width: 100%; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.75rem; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; }

        .gift-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); backdrop-filter: blur(15px); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .gift-card { background: white; padding: 30px; border-radius: 40px; text-align: center; border: 2px solid var(--champagne); width: 90%; max-width: 350px; }
        .gift-gif-container { width: 120px; height: 120px; margin: 0 auto 15px; border-radius: 20px; overflow: hidden; display: none; }
        .gift-gif-container img { width: 100%; height: 100%; object-fit: cover; }
        
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="particles-layer" id="particleBase"></div>

    <div class="main-container" id="homeUI">
        <span class="name-header">Sadaf ji ❤️</span>
        <h1>Will you be my valentine?!</h1>
        <div class="btn-group">
            <button class="btn-premium btn-yes" onclick="celebrateAndShow('yesPop')">Yes</button>
            <button class="btn-premium" onclick="showOverlay('noPop')">No</button>
        </div>
    </div>

    <div id="noPop" class="overlay">
        <div class="glass-card">
            <h2>The Choice ✨</h2>
            <div class="comp-wrap">
                <div class="side-box">
                    <div class="label-title" style="color: #d4a373;">Pros ✅</div>
                    <div class="gif-frame pros-gifs">
                        <img src="https://media.tenor.com/ffG8ZgTeQ74AAAAj/peach-and-goma-cute.gif">
                        <img src="https://media.tenor.com/6FX5WSa1QIwAAAAi/peach-goma-peach-and-goma.gif">
                        <img src="https://media.tenor.com/16JLRwPfDfAAAAAj/dudu-bubu-dancing-so-cute.gif">
                    </div>
                    <div class="pros-cycle-text">
                        <span>Endless Smiles</span>
                        <span>Sweetest Partner</span>
                        <span>Unlimited Love</span>
                    </div>
                </div>
                <div class="side-box">
                    <div class="label-title" style="color: #999;">Cons ❌</div>
                    <div class="gif-frame"><img src="https://media.tenor.com/Fml1EdnqjfwAAAAj/%E4%BD%95%E3%82%82%E3%81%AA%E3%81%84-%E3%82%BC%E3%83%AD.gif" style="width:100%; height:100%; object-fit:cover;"></div>
                    <div style="font-size: 0.65rem; font-weight: 700; color: #bbb;">Absolutely None</div>
                </div>
            </div>
            <button class="btn-premium btn-yes" style="width:100%" onclick="hideOverlay('noPop'); celebrateAndShow('yesPop')">I Agree ❤️</button>
        </div>
    </div>

    <div id="yesPop" class="overlay">
        <div class="glass-card">
            <h2>Perfect! 🥰</h2>
            <p>You have unlocked the special notes.</p>
            <button class="btn-premium btn-yes" style="width: 100%; margin-top: 15px;" onclick="enterVault()">Open Notes 💌</button>
        </div>
    </div>

    <div id="letterPop" class="overlay">
        <div class="glass-card">
            <h2>Your Notes</h2>
            <div class="grid-row">
                <div class="item-btn" onclick="openEnvelope('Note I', 'Your love is the oxygen I didn\'t know I needed until I finally breathed you in. ❤️ \n\nYou are the poetry in my silence and the fire in my soul. 🔥 \n\nEvery heartbeat of mine belongs to you, today and for all eternity. 💖✨ \n\nHappy Valentine’s Day to my one and only! ❤️❤️❤️')"><span>✉️</span> Note 1</div>
                <div class="item-btn" onclick="openEnvelope('Note II', 'Valentine’s Day honors a saint who defied all for love, reminding us that true devotion is the world’s greatest power. 🏛️📜 \n\nFor me, it’s a day to celebrate you—the one who turned my life into a masterpiece. 🎨✨ \n\nYou are my reason, my heart, and my greatest blessing. 🛐💖 \n\nHappy Valentine’s Day! 🌹💞')"><span>✉️</span> Note 2</div>
                <div class="item-btn" onclick="openEnvelope('Note III', 'I just wanted to say... \n\nI Love You! ❤️🌍✨ \n\nYou mean the world to me, Sadaf ji. Every moment with you is a gift. 🥰💞 \n\nNow, click below to see what else I have for you! 👇', true)"><span>✉️</span> Note 3</div>
            </div>
        </div>
    </div>

    <div id="giftPop" class="overlay">
        <div class="glass-card">
            <h2 style="color: var(--champagne);">The Gifts 🎁</h2>
            <div class="grid-row">
                <div class="item-btn" onclick="revealGift('A giant hug! 🧸', 'https://media.tenor.com/NGFif4dxa-EAAAAj/hug-hugs.gif')"><span>💝</span> Gift 1</div>
                <div class="item-btn" onclick="revealGift('I know your stomach has its own personality! 🍕 \n\nLet\'s go on a massive food date where we try everything you\'ve been craving. Your favorite treats, endless laughs, and a happy full belly – that\'s my promise to you! 🍟🥤', 'https://media.tenor.com/A-T3YM7Kx0oAAAAj/hungry-santa.gif')"><span>🍕</span> Gift 2</div>
                <div class="item-btn" onclick="revealGift('A peaceful evening with a warm cup of Chai, just the two of us. ☕ \n\nSoft music, deep talks, and that perfect comfort we share. We will meet soon to make this happen! ❤️')"><span>☕</span> Gift 3</div>
            </div>
            <button class="btn-premium" style="margin-top: 25px; width: 100%;" onclick="location.reload()">Replay ❤️</button>
        </div>
    </div>

    <div id="envModal" class="env-modal">
        <div class="envelope" id="envObj">
            <div class="letter-paper">
                <div class="letter-scroll-area">
                    <h3 id="envHead" style="font-family:'Dancing Script'; margin:0; border-bottom:1px solid #eee; padding-bottom: 5px;"></h3>
                    <p id="envBody" style="margin: 15px 0; font-size: 0.95rem; color: #555; white-space: pre-line; line-height:1.6;"></p>
                </div>
                <button id="giftNavBtn" style="background:var(--champagne); color:white; border:none; padding:12px; width:100%; border-radius:10px; cursor:pointer; font-weight:700; margin-top: 10px; display:none;" onclick="showTreasury()">See My Gifts ✨</button>
                <button class="close-note-btn" onclick="closeEnvelope()"><span>💖</span> Close Note <span>✖</span></button>
            </div>
        </div>
    </div>

    <div id="giftRevealModal" class="gift-overlay" onclick="closeGift()">
        <div class="glass-card" onclick="event.stopPropagation()">
            <div id="giftGifContainer" class="gift-gif-container"><img id="giftGif" src=""></div>
            <div id="giftEmoji" style="font-size: 3rem; margin-bottom: 10px;">🎁</div>
            <h3 style="font-family:'Dancing Script'; font-size: 1.8rem; color: var(--champagne);">You unlocked:</h3>
            <p id="giftText" style="font-weight: 700; font-size: 1rem; color: #555; white-space: pre-line;"></p>
            <button class="btn-premium btn-yes" style="margin-top: 20px; width: 100%;" onclick="closeGift()">Thank You ❤️</button>
        </div>
    </div>

    <script>
        let heartInterval = 400; 
        let generationTask;

        function initHearts() {
            const base = document.getElementById('particleBase');
            function createHeart() {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 8 + 10) + 'px'; 
                heart.style.animationDuration = `${(Math.random() * 3 + 4)}s, 2s`;
                base.appendChild(heart);
                setTimeout(() => heart.remove(), 8000);
            }
            generationTask = setInterval(createHeart, heartInterval);
        }

        function celebrateAndShow(id) { clearInterval(generationTask); heartInterval = 150; initHearts(); showOverlay(id); }
        initHearts();

        function showOverlay(id) { document.getElementById(id).style.display = 'flex'; }
        function hideOverlay(id) { document.getElementById(id).style.display = 'none'; }
        
        function enterVault() { 
            document.getElementById('homeUI').style.display = 'none';
            hideOverlay('yesPop'); 
            showOverlay('letterPop'); 
            document.body.classList.add('gold-theme'); 
        }

        function openEnvelope(head, body, isFinal) {
            document.getElementById('envHead').innerText = head;
            document.getElementById('envBody').innerText = body;
            document.getElementById('giftNavBtn').style.display = isFinal ? 'block' : 'none';
            document.getElementById('envModal').style.display = 'flex';
            setTimeout(() => { document.getElementById('envObj').classList.add('open'); }, 100);
        }

        function closeEnvelope() {
            document.getElementById('envObj').classList.remove('open');
            setTimeout(() => { document.getElementById('envModal').style.display = 'none'; }, 800);
        }

        function revealGift(text, gifUrl) {
            document.getElementById('giftText').innerText = text;
            const gifCont = document.getElementById('giftGifContainer');
            if(gifUrl) { document.getElementById('giftGif').src = gifUrl; gifCont.style.display = 'block'; document.getElementById('giftEmoji').style.display = 'none'; }
            else { gifCont.style.display = 'none'; document.getElementById('giftEmoji').style.display = 'block'; }
            document.getElementById('giftRevealModal').style.display = 'flex';
        }

        function closeGift() { document.getElementById('giftRevealModal').style.display = 'none'; }
        function showTreasury() { closeEnvelope(); hideOverlay('letterPop'); setTimeout(() => showOverlay('giftPop'), 500); }
    </script>
</body>
</html>
